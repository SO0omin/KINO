spring.application.name=kino
# 실제 키는 git에 올라가지 않는 application-secret.properties 에서 읽습니다.
# 파일이 없으면 환경변수를 사용합니다. 양식은 application-secret.properties.example 참고.
spring.config.import=optional:classpath:application-secret.properties

# 1. RDS ?? ?? (??? ?? ??? ??? ????)
spring.datasource.url=jdbc:mysql://${RDS_HOST:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:kino_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${RDS_USERNAME:root}
spring.datasource.password=${RDS_PASSWORD:}

# 2. ???? ?? (MySQL?)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA ?? (?? ? ? ???? ??? ????? ??)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:true}

#4. toss api key (환경변수 우선)
toss.secret-key=${TOSS_SECRET_KEY:}

# 5. 환불 개발 모드 (true면 Toss 취소 API 호출 생략, DB 상태만 취소 처리)
toss.cancel.mock-enabled=${TOSS_CANCEL_MOCK_ENABLED:true}

# 6. SMS 인증 (Solapi)
sms.mock-enabled=${SMS_MOCK_ENABLED:false}
sms.mock-auth-code=${SMS_MOCK_AUTH_CODE:123456}

# 6-1. 메일 본문에 넣을 서비스 주소
app.base-url=${APP_BASE_URL:http://localhost:5173}

#7. jwt
jwt.secret=${JWT_SECRET:kino-local-development-only-secret-do-not-use-in-production}

#8. oauth(kakao, google, apple)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/callback/kakao}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}

naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}

google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/callback/google}

#9. sending-mail info
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

#10.
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
solapi.from-number=${SOLAPI_FROM_NUMBER:}
