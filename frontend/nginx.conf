server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 없는 경로는 index.html이 받아서 react-router가 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> 백엔드 컨테이너
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger (운영에서 막으려면 이 블록을 지우세요)
    location /swagger-ui/ { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }

    # WebSocket(SockJS) -> 백엔드 컨테이너
    location ~ ^/(ws-seat|ws-kino) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
