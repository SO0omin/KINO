name: CI/CD Pipeline

# 배포 대상 EC2를 상시 운영하지 않으므로 수동 실행으로 둡니다.
# Actions 탭 > CI/CD Pipeline > Run workflow 로 실행합니다.
# 다시 자동 배포하려면 아래 workflow_dispatch를 push 트리거로 바꾸세요.
#
#   on:
#     push:
#       branches: [ main ]
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        run: |
          docker build -t so0omin/backend ./backend
          docker push so0omin/backend

      - name: Build and Push Frontend
        run: |
          docker build -t so0omin/frontend ./frontend
          docker push so0omin/frontend

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/KinoProject
            # .env 파일 생성 (변수 주입)
            echo "RDS_PASSWORD=${{ secrets.RDS_PASSWORD }}" > .env
            echo "RDS_USERNAME=${{ secrets.RDS_USERNAME }}" >> .env
            echo "RDS_HOST=${{ secrets.RDS_HOST }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            # 스키마는 첫 배포 때 한 번만 update 로 생성하고, 이후에는 validate 로 검증만 합니다.
            echo "JPA_DDL_AUTO=${{ vars.JPA_DDL_AUTO || 'validate' }}" >> .env
            echo "JPA_SHOW_SQL=false" >> .env
            
            # 최신 이미지 받고 컨테이너 재시작
            sudo docker pull so0omin/backend
            sudo docker pull so0omin/frontend
            sudo docker-compose down
            sudo docker-compose up -d