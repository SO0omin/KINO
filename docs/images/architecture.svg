<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="620" viewBox="0 0 1140 620" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
  </defs>

  <rect width="1140" height="620" fill="#FFFFFF"/>

  <text x="40" y="42" font-size="19" font-weight="700" fill="#1A1A1A">KINO System Architecture</text>
  <rect x="40" y="52" width="46" height="3" fill="#B91C1C"/>

  <!-- ============ CI / CD ============ -->
  <rect x="40" y="78" width="1058" height="74" rx="3" fill="#FAFAFA" stroke="#E4E4E4"/>
  <text x="56" y="98" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="2.4">CI / CD</text>

  <rect x="170" y="104" width="128" height="34" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="234" y="126" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">main push</text>

  <rect x="350" y="104" width="150" height="34" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="425" y="126" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">GitHub Actions</text>

  <rect x="552" y="104" width="140" height="34" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="622" y="126" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Docker Hub</text>

  <rect x="744" y="104" width="150" height="34" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="819" y="126" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">SSH deploy</text>

  <line x1="298" y1="121" x2="344" y2="121" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="500" y1="121" x2="546" y2="121" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="692" y1="121" x2="738" y2="121" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="527" y="100" font-size="9.5" fill="#8A8A8A" text-anchor="middle">image push</text>

  <path d="M819,138 L819,182 L790,182" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#a2)"/>
  <text x="832" y="168" font-size="9.5" fill="#8A8A8A">compose up</text>

  <!-- ============ Browser ============ -->
  <rect x="40" y="278" width="136" height="92" rx="3" fill="#1A1A1A"/>
  <text x="108" y="312" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Browser</text>
  <text x="108" y="332" font-size="10" fill="#BDBDBD" text-anchor="middle">React 19 · Vite</text>
  <text x="108" y="349" font-size="10" fill="#BDBDBD" text-anchor="middle">TypeScript</text>

  <!-- ============ EC2 ============ -->
  <rect x="300" y="196" width="478" height="292" rx="4" fill="none" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <rect x="300" y="196" width="106" height="24" rx="2" fill="#B91C1C"/>
  <text x="353" y="213" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AWS EC2</text>
  <text x="418" y="213" font-size="10" fill="#8A8A8A">docker compose</text>

  <rect x="326" y="248" width="176" height="152" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="326" y="248" width="176" height="30" rx="3" fill="#1A1A1A"/>
  <text x="414" y="268" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Nginx :80</text>
  <text x="342" y="300" font-size="10.5" fill="#1A1A1A">정적 파일 서빙</text>
  <text x="342" y="322" font-size="10.5" fill="#1A1A1A">SPA fallback</text>
  <text x="342" y="344" font-size="10.5" fill="#1A1A1A">/api → 백엔드</text>
  <text x="342" y="366" font-size="10.5" fill="#1A1A1A">/ws-* 업그레이드</text>
  <text x="342" y="388" font-size="9.5" fill="#8A8A8A">same origin · CORS 불필요</text>

  <rect x="544" y="248" width="208" height="152" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="544" y="248" width="208" height="30" rx="3" fill="#1A1A1A"/>
  <text x="648" y="268" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Spring Boot :8080</text>
  <text x="560" y="300" font-size="10.5" fill="#1A1A1A">JwtFilter → Security</text>
  <text x="560" y="322" font-size="10.5" fill="#1A1A1A">Controller · Service · Repository</text>
  <text x="560" y="344" font-size="10.5" fill="#1A1A1A">STOMP 브로커</text>
  <text x="560" y="366" font-size="10.5" fill="#1A1A1A">Scheduler · 좌석 만료 정리</text>
  <text x="560" y="388" font-size="9.5" fill="#8A8A8A">비관적 락 · 트랜잭션 경계</text>

  <line x1="502" y1="324" x2="538" y2="324" stroke="#1A1A1A" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- browser <-> nginx -->
  <line x1="176" y1="306" x2="294" y2="306" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="235" y="298" font-size="9.5" fill="#8A8A8A" text-anchor="middle">HTTPS</text>
  <line x1="294" y1="344" x2="176" y2="344" stroke="#B91C1C" stroke-width="1.3" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="235" y="362" font-size="9.5" fill="#B91C1C" text-anchor="middle">STOMP / SockJS</text>

  <!-- ============ RDS ============ -->
  <rect x="544" y="524" width="208" height="62" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
  <text x="648" y="548" font-size="12" font-weight="700" fill="#1A1A1A" text-anchor="middle">AWS RDS · MySQL 8</text>
  <text x="648" y="568" font-size="10" fill="#8A8A8A" text-anchor="middle">kino_db · 24 tables</text>
  <line x1="648" y1="400" x2="648" y2="518" stroke="#1A1A1A" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="662" y="464" font-size="9.5" fill="#8A8A8A">JPA · Hibernate</text>

  <!-- ============ External ============ -->
  <rect x="826" y="196" width="272" height="292" rx="4" fill="#FAFAFA" stroke="#E4E4E4"/>
  <text x="846" y="220" font-size="10" font-weight="700" fill="#B91C1C" letter-spacing="2.4">EXTERNAL</text>

  <rect x="846" y="238" width="232" height="52" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="862" y="259" font-size="11.5" font-weight="700" fill="#1A1A1A">토스페이먼츠</text>
  <text x="862" y="277" font-size="9.5" fill="#8A8A8A">결제 승인 · 취소</text>

  <rect x="846" y="300" width="232" height="52" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="862" y="321" font-size="11.5" font-weight="700" fill="#1A1A1A">OAuth2</text>
  <text x="862" y="339" font-size="9.5" fill="#8A8A8A">카카오 · 네이버 · 구글</text>

  <rect x="846" y="362" width="232" height="52" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="862" y="383" font-size="11.5" font-weight="700" fill="#1A1A1A">Gmail SMTP</text>
  <text x="862" y="401" font-size="9.5" fill="#8A8A8A">비밀번호 재설정 · 예매 완료</text>

  <rect x="846" y="424" width="232" height="52" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="862" y="445" font-size="11.5" font-weight="700" fill="#1A1A1A">Solapi</text>
  <text x="862" y="463" font-size="9.5" fill="#8A8A8A">SMS 인증</text>

  <line x1="752" y1="324" x2="820" y2="324" stroke="#1A1A1A" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- legend -->
  <line x1="40" y1="566" x2="70" y2="566" stroke="#B91C1C" stroke-width="1.4"/>
  <text x="78" y="570" font-size="9.5" fill="#8A8A8A">실시간 양방향</text>
  <line x1="170" y1="566" x2="200" y2="566" stroke="#8A8A8A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="208" y="570" font-size="9.5" fill="#8A8A8A">배포 파이프라인</text>
</svg>
